# Gateway config for the papergate batch run. Self-contained so the batch
# does not depend on ~/.promptforge, which the Workshop app also writes.
# Secrets are never stored here: both keys expand from the environment
# (see ~/.promptforge/gateway.env).
config-version = 2

[server]
bind = "127.0.0.1:8081"
api_key = "${PROMPTFORGE_GATEWAY_API_KEY}"

[[endpoint]]
id = "runpod"
protocol = "openai"
base_url = "https://sgjy18glyi4blu-8000.proxy.runpod.net/v1"
api_key = "${VLLM_DEEPSEEK_API_KEY}"

[[model]]
name = "analyst"
kind = "chat"
description = "A model suited for careful analysis, coding, and general assistance"
context = 131072
upstream = "deepseek-v4-pro"
endpoints = ["runpod"]

[[profile]]
name = "runpod"
models = ["analyst"]
